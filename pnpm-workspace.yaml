# pnpm 11.x build approval with version pinning.
# Replaces the legacy onlyBuiltDependencies setting in .npmrc.
#
# Version-pinned allowlist for supply-chain defense-in-depth:
# If a new (potentially compromised) version of any of these packages is
# published, pnpm will REFUSE to run its postinstall script because the
# exact version isn't in this list. You must explicitly opt-in to upgrade.
#
# To upgrade: bump the version in `package.json`, run `pnpm install`,
# then update the pinned version here to match the lockfile resolution.
#
# Syntax reference: https://pnpm.io/settings/build#allowbuilds

allowBuilds:
  # esbuild — native JS/CSS/TS bundler, pulled by astro.
  esbuild@0.28.1: true

  # workerd — Cloudflare Workers runtime (open-source), used by the
  # @astrojs/cloudflare adapter for SSR builds and local dev.
  workerd@1.20260801.1: true

  # sharp — native image processing (libvips bindings).
  # Two versions coexist because pnpm isolates transitive deps:
  #   - 0.35.2 — pulled transitively by miniflare → @astrojs/cloudflare
  #   - 0.35.3 — pulled directly by astro
  # Listed as two separate keys (not `||` syntax) to eliminate parser
  # ambiguity — each version must be explicitly opted-in, no implicit
  # range coverage that could silently degrade the security control.
  sharp@0.35.2: true
  sharp@0.35.3: true
